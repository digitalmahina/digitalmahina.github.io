<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Кольский метеослой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      /* The page is one full-screen map app, so the page frame is replaced;
         every colour, radius and type below is a Hark token. */
      html, body { height: 100%; overflow: hidden; }
      body { background: #0d1117; color: var(--text-primary); }

      .x-app { position: fixed; inset: 0; display: block; }
      .x-map { position: absolute; inset: 0; background: #0d1117; }
      .x-fallback { position: absolute; inset: 0; display: none; }
      .x-fallback svg { width: 100%; height: 100%; display: block; }
      .x-wind { position: absolute; inset: 0; pointer-events: none; z-index: 450; }
      .leaflet-container { background: #0d1117; font: var(--type-small); }
      .x-fb-mark { position: absolute; transform: translate(-50%, -50%); cursor: pointer; border: 0; padding: 0; background: none; z-index: 2; }
      .x-fb-mark .x-synop { display: block; width: 18px; height: 18px; }
      .leaflet-control-attribution { background: rgb(13 17 23 / 0.7) !important; color: var(--text-secondary); font: var(--type-caption); }
      .leaflet-control-attribution a { color: var(--text-secondary); }

      .x-glass {
        background: rgb(22 27 34 / 0.82);
        -webkit-backdrop-filter: var(--hark-blur);
        backdrop-filter: var(--hark-blur);
        border: 1px solid var(--stroke-primary);
        box-shadow: 0 8px 40px rgb(0 0 0 / 0.45);
      }

      /* top bar */
      .x-top {
        position: absolute; z-index: 600;
        top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; right: 12px;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 8px 12px; border-radius: var(--r-pill);
      }
      .x-brand { font: var(--type-body-strong); white-space: nowrap; }
      .x-brand small { display: block; font: var(--type-caption); color: var(--text-secondary); }
      .x-top .x-spacer { flex: 1 1 auto; }

      .x-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
      .x-tgl {
        min-height: 32px; padding: 6px 12px; border-radius: var(--r-pill);
        border: 1px solid var(--stroke-primary); background: transparent;
        color: var(--text-secondary); font: var(--type-tag); cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .x-tgl:hover { color: var(--text-primary); }
      .x-tgl[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); border-color: transparent; }
      .x-tgl--alert[aria-pressed="true"] { background: var(--fill-system-orange); color: #0d1117; }
      @media (max-width: 760px) {
        .x-tgl { min-height: var(--tap); }
        .leaflet-touch .leaflet-bar a { width: var(--tap); height: var(--tap); line-height: var(--tap); }
        .leaflet-control-attribution a { display: inline-block; min-height: var(--tap); line-height: var(--tap); padding-inline: 4px; }
      }

      /* side sheet / list panel */
      .x-panel {
        position: absolute; z-index: 600;
        top: calc(env(safe-area-inset-top, 0px) + 72px); right: 12px; width: 340px;
        max-height: calc(100% - 190px); overflow: auto;
        border-radius: var(--r-l); padding: 16px;
      }
      .x-panel h2 { font: var(--type-heading); margin-bottom: 2px; }
      .x-panel h3 { font: var(--type-body-strong); margin: 14px 0 6px; }
      .x-panel p.x-sub { font: var(--type-caption); color: var(--text-secondary); }
      .x-close {
        float: right; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        border: 1px solid var(--stroke-primary); background: transparent; color: var(--text-primary);
        font: var(--type-label); line-height: 1;
      }
      .x-rows { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
      .x-row {
        width: 100%; text-align: left; cursor: pointer; display: grid;
        grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
        min-height: var(--tap); padding: 8px 10px; border-radius: var(--r-s);
        border: 1px solid var(--stroke-secondary); background: var(--fill-tertiary); color: inherit;
      }
      .x-row:hover { border-color: var(--stroke-primary); }
      .x-row b { font: var(--type-body-strong); display: block; }
      .x-row small { font: var(--type-caption); color: var(--text-secondary); }
      .x-row .x-val { font: var(--weight-medium) var(--size-small)/1.3 "Geist Mono", ui-monospace, monospace; white-space: nowrap; }
      .x-bullet { width: 10px; height: 10px; border-radius: 50%; }
      .x-flag { display: inline-block; padding: 2px 8px; border-radius: var(--r-pill); font: var(--type-tag); color: #0d1117; }

      .x-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
      .x-kv dt { font: var(--type-caption); color: var(--text-secondary); }
      .x-kv dd { margin: 0; font: var(--weight-medium) var(--size-small)/1.3 "Geist Mono", ui-monospace, monospace; }
      .x-raw {
        margin-top: 12px; padding: 10px; border-radius: var(--r-s);
        background: var(--fill-tertiary); color: var(--text-secondary);
        font: var(--weight-regular) var(--size-caption)/1.5 "Geist Mono", ui-monospace, monospace;
        word-break: break-word;
      }
      .x-note { margin-top: 10px; padding: 10px; border-radius: var(--r-s); font: var(--type-caption); }
      .x-note--bad { background: rgb(255 77 0 / 0.14); color: #ffb08a; border: 1px solid rgb(255 77 0 / 0.35); }
      .x-note--ok { background: rgb(0 166 101 / 0.14); color: #7fdcb4; border: 1px solid rgb(0 166 101 / 0.35); }

      /* bottom bar */
      .x-bottom {
        position: absolute; z-index: 600;
        left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        border-radius: var(--r-l); padding: 10px 14px;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      }
      .x-time { font: var(--weight-medium) var(--size-small)/1.3 "Geist Mono", ui-monospace, monospace; white-space: nowrap; }
      .x-status { font: var(--type-caption); color: var(--text-secondary); }
      .x-legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-left: auto; }
      .x-legend span { display: inline-flex; align-items: center; gap: 5px; font: var(--type-caption); color: var(--text-secondary); }
      .x-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .x-disc { width: 100%; font: var(--type-caption); color: var(--text-secondary); }

      .x-sel { background: rgb(22 27 34 / 0.9); color: var(--text-primary); padding-right: 8px; }
      .x-sel option { background: #161b22; color: #e6edf3; }
      .x-tl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%; }
      .x-tl input[type=range] { flex: 1 1 220px; min-width: 160px; height: var(--tap, 44px); accent-color: var(--fill-system-orange); }
      .x-flegend { display: inline-flex; align-items: center; gap: 8px; font: var(--type-caption); color: var(--text-secondary); }
      .x-flegend i { display: inline-block; width: 90px; height: 8px; border-radius: 4px; }
      .x-field { image-rendering: auto; }
      .x-probe { position: fixed; z-index: 900; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: rgb(13 17 23 / 0.88); border: 1px solid rgb(255 255 255 / 0.12); color: #e6edf3; font: 500 12px/1.4 "Geist Mono", ui-monospace, monospace; box-shadow: 0 6px 24px rgb(0 0 0 / .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); white-space: nowrap; }
      .x-probe b { color: #fff; font-weight: 600; }
      .x-play { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; border: 0; background: var(--fill-system-orange); color: #0d1117; font: 600 13px/1 "Geist", sans-serif; cursor: pointer; box-shadow: 0 2px 10px rgb(0 0 0 / .4); }
      .x-play:hover { filter: brightness(1.1); }
      .x-wl i { display: inline-block; width: 70px; height: 6px; border-radius: 3px; }
      .x-arrow { pointer-events: none; }
      .x-arrow svg { filter: drop-shadow(0 1px 2px rgb(0 0 0 / .6)); transition: transform .4s; }
      .x-field { filter: saturate(1.1); }
      .x-glass { background: rgb(18 22 30 / 0.72); border-color: rgb(255 255 255 / 0.08); }
      .x-tgl { transition: background .15s, color .15s, border-color .15s; }
      .x-panel--wide { width: 440px; }
      .x-alab { pointer-events: none; display: flex !important; justify-content: center; }
      .x-alab span { background: rgba(13,17,23,.85); color: #cfe6ff; border: 1px solid rgba(158,203,255,.5); border-radius: 6px; padding: 0 4px; font: 600 11px/15px "Geist Mono", ui-monospace, monospace; white-space: nowrap; }
      .x-gr { margin: 10px 0; }
      .x-gk { font: var(--type-caption); color: var(--text-secondary); margin-bottom: 2px; }
      .x-gv { font: var(--weight-medium) var(--size-small)/1.45 "Geist Mono", ui-monospace, monospace; overflow-wrap: anywhere; }
      .x-wt { width: 100%; border-collapse: collapse; font: var(--weight-medium) var(--size-small)/1.3 "Geist Mono", ui-monospace, monospace; }
      .x-wt th { font: var(--type-caption); color: var(--text-secondary); text-align: left; padding: 2px 6px 4px 0; }
      .x-wt td { padding: 3px 6px 3px 0; border-top: 1px solid var(--stroke-primary); white-space: nowrap; }
      @media (max-width: 760px) { .x-panel--wide { width: auto; } }
      .x-gam { background: #ffd400; color: #0d1117; border-color: transparent; font-weight: 600; }
      .x-gam:hover { color: #0d1117; filter: brightness(1.1); }
      .x-gam--old { background: #6b7280; color: #fff; }
      .leaflet-bottom.leaflet-right, .leaflet-bottom.leaflet-left { bottom: 150px; }
      @media (max-width: 760px) { .leaflet-bottom.leaflet-right, .leaflet-bottom.leaflet-left { bottom: 200px; } }
      /* markers */
      .x-metar {
        font: var(--weight-medium) 11px/1 "Geist Mono", ui-monospace, monospace;
        padding: 4px 6px; border-radius: 6px; color: #0d1117; white-space: nowrap;
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.5); text-align: center;
      }
      .x-metar b { display: block; font-size: 11px; }
      .x-metar i { display: block; font-style: normal; font-size: 10px; opacity: 0.8; }
      .x-synop { border-radius: 50%; border: 2px solid rgb(13 17 23 / 0.8); box-shadow: 0 2px 8px rgb(0 0 0 / 0.5); }
      .x-pick { outline: 2px solid var(--fill-system-orange); outline-offset: 2px; }

      @media (max-width: 760px) {
        .x-top { gap: 8px; padding: 8px 10px; border-radius: var(--r-l); }
        .x-brand small { display: none; }
        .x-panel {
          top: auto; left: 12px; right: 12px; width: auto;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
          max-height: 62%; border-radius: var(--r-l);
        }
        .x-panel { bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); max-height: 50%; }
        .x-bottom { padding: 8px 12px; gap: 6px 10px; }
        .x-legend { display: none; }
        .leaflet-bottom.leaflet-right, .leaflet-bottom.leaflet-left { bottom: 96px; }
      }

      /* ===== v2 ===== */
      :root { --x-bg: rgb(12 15 21 / 0.78); --x-line: rgb(255 255 255 / 0.07); --x-dim: #8b95a5; }
      .x-glass { background: var(--x-bg); border: 1px solid var(--x-line); box-shadow: 0 10px 40px rgb(0 0 0 / .5), inset 0 1px 0 rgb(255 255 255 / .04); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); }
      .x-top { left: 92px; border-radius: 14px; padding: 6px 8px 6px 14px; min-height: 48px; }
      .x-brand { font: 600 15px/1.15 "Geist", sans-serif; letter-spacing: -.01em; }
      .x-brand small { font: 400 11px/1.3 "Geist", sans-serif; color: var(--x-dim); }
      .x-tgl { border-radius: 9px; border-color: var(--x-line); background: rgb(255 255 255 / .03); font: 500 12px/1 "Geist", sans-serif; letter-spacing: .01em; }
      .x-tgl[aria-pressed="true"] { background: rgb(255 255 255 / .92); color: #0d1117; }
      .x-tgl--alert[aria-pressed="true"] { background: #ff8a00; color: #0d1117; }
      .x-rail { position: absolute; z-index: 610; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); width: 68px; border-radius: 14px; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; max-height: calc(100% - 200px); overflow-y: auto; scrollbar-width: none; }
      .x-rail-h { font: 600 9px/1 "Geist", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--x-dim); text-align: center; margin: 6px 0 4px; }
      .x-rail-g { display: flex; flex-direction: column; gap: 3px; }
      .x-rf { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--x-dim); cursor: pointer; font: 500 10px/1.1 "Geist", sans-serif; transition: background .15s, color .15s; }
      .x-rf:hover { background: rgb(255 255 255 / .06); color: #e6edf3; }
      .x-rf[aria-pressed="true"] { background: linear-gradient(180deg, rgb(255 138 0 / .22), rgb(255 138 0 / .08)); color: #ffb35c; box-shadow: inset 0 0 0 1px rgb(255 138 0 / .35); }
      .x-rl { width: 100%; justify-content: center; min-height: 30px !important; padding: 5px 2px !important; font-size: 10px !important; text-align: center; white-space: normal; line-height: 1.1 !important; }
      .x-panel { border-radius: 14px; top: calc(env(safe-area-inset-top, 0px) + 72px); }
      .x-panel h2 { font: 600 22px/1.1 "Geist", sans-serif; letter-spacing: -.02em; }
      .x-panel h3 { font: 600 10px/1 "Geist", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--x-dim); margin: 18px 0 8px; }
      .x-hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; }
      .x-hc { background: rgb(255 255 255 / .04); border: 1px solid var(--x-line); border-radius: 10px; padding: 8px 9px; }
      .x-hc span { display: block; font: 500 10px/1 "Geist", sans-serif; color: var(--x-dim); margin-bottom: 6px; }
      .x-hc b { font: 500 19px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: -.03em; color: #f0f4f8; white-space: nowrap; }
      .x-hc b small { font-size: 11px; color: var(--x-dim); margin-left: 3px; letter-spacing: 0; }
      .x-hc--bad { border-color: rgb(255 77 0 / .5); background: rgb(255 77 0 / .1); }
      .x-hc--bad b { color: #ff9a5c; }
      .x-mg { margin-bottom: 8px; }
      .x-mg-h, .x-mg-x { display: flex; justify-content: space-between; font: 500 10px/1.2 "Geist", sans-serif; color: var(--x-dim); margin-bottom: 3px; }
      .x-mg svg { display: block; border-radius: 6px; background: rgb(255 255 255 / .025); }
      .x-row { border-radius: 10px; border-color: var(--x-line); background: rgb(255 255 255 / .03); }
      .x-bottom { left: 92px; border-radius: 14px; padding: 8px 14px 6px; gap: 4px 14px; }
      .x-time { font: 500 12px/1.2 "Geist Mono", ui-monospace, monospace; color: #e6edf3; }
      .x-status { font: 400 11px/1.2 "Geist", sans-serif; color: var(--x-dim); }
      .x-legend span { font: 500 10px/1 "Geist", sans-serif; color: var(--x-dim); }
      .x-disc { font: 400 10px/1.3 "Geist", sans-serif; color: rgb(139 149 165 / .7); }
      .x-tl { gap: 10px; flex-wrap: nowrap; }
      .x-trk { position: relative; flex: 1 1 auto; min-width: 160px; padding-bottom: 14px; }
      .x-trk input[type=range] { width: 100%; height: 26px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; }
      .x-trk input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgb(255 138 0 / .6), rgb(255 255 255 / .15)); }
      .x-trk input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgb(255 138 0 / .6), rgb(255 255 255 / .15)); }
      .x-trk input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 3px solid #ff8a00; box-shadow: 0 0 0 4px rgb(255 138 0 / .2); }
      .x-trk input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid #ff8a00; }
      .x-ticks { position: absolute; left: 8px; right: 8px; bottom: 0; height: 12px; }
      .x-ticks span { position: absolute; transform: translateX(-50%); font: 500 9px/1 "Geist Mono", ui-monospace, monospace; color: var(--x-dim); white-space: nowrap; }
      .x-ticks span.x-tick-day { color: #ffb35c; }
      .x-ticks span.x-tick-now { color: #fff; font-weight: 600; }
      .x-flegend { flex: 0 0 auto; font: 500 10px/1.2 "Geist", sans-serif; }
      .x-flegend i { width: 110px; height: 6px; border-radius: 3px; }
      .x-st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px 3px 4px; border-radius: 7px; background: rgb(12 15 21 / .82); border: 1px solid rgb(255 255 255 / .1); box-shadow: 0 2px 10px rgb(0 0 0 / .5); white-space: nowrap; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
      .x-st i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
      .x-st b { font: 600 11px/1 "Geist Mono", ui-monospace, monospace; color: #f0f4f8; }
      .x-st em { font: 600 9px/1 "Geist", sans-serif; font-style: normal; letter-spacing: .04em; }
      .x-tgl.x-gam { background: #ffd400; color: #0d1117; border-color: transparent; font-weight: 600; }
      .x-tgl.x-gam--old { background: #6b7280; color: #fff; }
      .x-panel { padding-bottom: 28px; }
      .x-ticks span { font-size: 10px; color: #b4bdc9; }
      .x-hill { mix-blend-mode: screen; filter: contrast(1.5) brightness(.85); }
      .leaflet-control-zoom a { background: var(--x-bg) !important; color: #e6edf3 !important; border-color: var(--x-line) !important; }
      .leaflet-bottom.leaflet-left { left: 80px; }
      @media (max-width: 760px) {
        .x-top { left: 12px; }
        .x-rail { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); left: 12px; right: 12px; width: auto; flex-direction: row; max-height: none; overflow-x: auto; padding: 5px; }
        .x-rail-h { display: none; }
        .x-rail-g { flex-direction: row; }
        .x-rf { min-width: 58px; }
        .x-rl { min-width: 58px; width: auto; }
        .x-bottom { left: 12px; }
        .leaflet-bottom.leaflet-left { left: 0; }
      }
    </style>
  </head>
  <body>
    <div class="x-app">
      <div id="map" class="x-map"></div>
      <div class="x-fallback" id="fallback" aria-hidden="true">
        <svg id="fb-svg" role="img" aria-label="Схематичная береговая линия Кольского полуострова">
          <path id="fb-coast" fill="#19212b" stroke="#3a4656" stroke-width="1.5" />
        </svg>
      </div>
      <canvas id="wind" class="x-wind"></canvas>

      <header class="x-top x-glass">
        <div class="x-brand">Кольский метеослой<small>Мурманская область · оперативная погода</small></div>
        <div class="x-spacer"></div>
        <div class="x-toggles" role="group" aria-label="Слои карты">
          <button class="x-tgl" id="t-wind" type="button" aria-pressed="true">Ветер</button>
          <button class="x-tgl" id="t-metar" type="button" aria-pressed="true">METAR</button>
          <button class="x-tgl" id="t-synop" type="button" aria-pressed="true">SYNOP</button>
          <button class="x-tgl x-tgl--alert" id="t-min" type="button" aria-pressed="false">Мой минимум 80 м × 800 м</button>
          <button class="x-tgl" id="t-list" type="button" aria-pressed="true">Список</button>
        </div>
      </header>

      <aside class="x-panel x-glass" id="panel" aria-live="polite"></aside>

      <footer class="x-bottom x-glass">
        <span class="x-time" id="clock">—</span>
        <span class="x-status" id="status">Загрузка карты…</span>
        <div class="x-legend">
          <span><i class="x-dot" style="background:#00a665"></i>VFR</span>
          <span><i class="x-dot" style="background:#4aa3ff"></i>MVFR</span>
          <span><i class="x-dot" style="background:#f1555b"></i>IFR</span>
          <span><i class="x-dot" style="background:#c77dff"></i>LIFR</span>
        </div>
        <p class="x-disc">Источники: aviationweather.gov (METAR), OGIMET (SYNOP Росгидромета). Поля и поток ветра — модель Open-Meteo, рельеф Esri. Не для выполнения полётов.</p>
      </footer>

    <script>
      (function () {
        "use strict";
        var METAR = JSON.parse(document.getElementById("metar-data").textContent);
        var SYNOP = JSON.parse(document.getElementById("synop-data").textContent);
        var CAT = { VFR: "#00a665", MVFR: "#4aa3ff", IFR: "#f1555b", LIFR: "#c77dff" };
        var MIN_CEIL = 80 * 3.28084; // 80 м в футах ≈ 262
        var MIN_VIS = 800; // м

        var elStatus = document.getElementById("status");
        var elClock = document.getElementById("clock");
        var panel = document.getElementById("panel");
        var state = { wind: true, metar: true, synop: true, min: false, list: true, sel: null };

        /* ---------- карта ---------- */
        // упрощённый контур суши (lat, lon) для запасной схемы
        var COAST = [[69.0,28.5],[69.7,30.0],[69.8,31.0],[69.95,32.0],[69.4,33.0],[68.95,33.1],[69.3,33.5],
          [69.2,35.0],[69.0,36.5],[68.6,38.0],[68.2,39.5],[67.8,40.5],[67.2,41.2],[66.5,41.0],[66.2,40.0],
          [66.1,38.5],[66.3,37.0],[66.4,35.5],[66.6,34.5],[66.75,33.5],[67.1,32.5],[66.9,32.2],[66.5,33.0],
          [66.2,33.5],[65.8,34.0],[65.5,33.0],[65.5,28.5]];
        var map = null, ok = false, failed = false;
        function setStatus(t) { elStatus.textContent = t; }
        try {
          if (window.L) {
            map = L.map("map", { zoomControl: false, attributionControl: true }).setView([68.0, 34.5], 6);
            L.control.zoom({ position: "bottomleft" }).addTo(map); map.attributionControl.setPosition("bottomleft");
            L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 16, minZoom: 4, pane: "overlayPane", opacity: 0.8
            }).addTo(map);
            L.tileLayer("https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade_Dark/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 16, maxNativeZoom: 13, minZoom: 4, opacity: 1, className: "x-hill", zIndex: 2, attribution: "Esri World Hillshade"
            }).addTo(map);
            var tiles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 16, minZoom: 4, attribution: "Esri, HERE, Garmin, © OpenStreetMap"
            });
            var tileErrs = 0;
            tiles.on("tileerror", function () { if (++tileErrs > 3) fail("Тайлы недоступны — показана схема берега"); });
            tiles.addTo(map);
            ok = true;
            setStatus("Данные обновлены " + kolaAge() + " · METAR и SYNOP, сбор каждые 30 мин");
          }
        } catch (e) { map = null; ok = false; }
        function fail(msg) {
          if (failed) return; failed = true;
          setStatus(msg);
          if (map && ok) {
            // карта работает, нет только подложки: рисуем контур в Leaflet
            L.polygon(COAST, { color: "#3a4656", weight: 1.5, fillColor: "#19212b", fillOpacity: 1, interactive: false }).addTo(map);

          }
          document.getElementById("map").style.display = "none";
          document.getElementById("fallback").style.display = "block";
          drawFallback();
        }

        /* ---------- проекция точек ---------- */
        var BOX = { w: 28.5, e: 41.5, s: 65.8, n: 70.3 };
        function project(lat, lon) {
          if (map && ok) { var p = map.latLngToContainerPoint([lat, lon]); return { x: p.x, y: p.y }; }
          var W = window.innerWidth, H = window.innerHeight;
          var k = Math.min(W / ((BOX.e - BOX.w) * 0.37), H / (BOX.n - BOX.s));

          return { x: cx + (lon - BOX.w) * 0.37 * k, y: cy + (BOX.n - lat) * k };
        }
        function drawFallback() {
          var fb = document.getElementById("fallback");
          var d = COAST.map(function (c, i) { var p = project(c[0], c[1]); return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ") + " Z";

          METAR.forEach(function (s) {
            var p = project(s.lat, s.lon), b = document.createElement("button");
            b.className = "x-fb-mark"; b.type = "button"; b.style.left = p.x + "px"; b.style.top = p.y + "px";

            b.addEventListener("click", function () { openMetar(s); });
            fb.appendChild(b);
          });
          SYNOP.forEach(function (s) {
            var p = project(s.lat, s.lon), b = document.createElement("button");
            b.className = "x-fb-mark"; b.type = "button"; b.style.left = p.x + "px"; b.style.top = p.y + "px";
            b.setAttribute("aria-label", s.name);
            b.innerHTML = '<span class="x-synop" style="background:' + synopColor(s) + '"></span>';
            b.addEventListener("click", function () { openSynop(s); });
            fb.appendChild(b);
          });
        }

        /* ---------- метки ---------- */
        var mMetar = [], mSynop = [];
        function makeMarkers() {
          if (!map || !ok) return;
          METAR.forEach(function (s) {
            var html =
              '<div class="x-st"><i style="background:' + CAT[s.cat] + ';box-shadow:0 0 0 3px ' + CAT[s.cat] + '33,0 0 12px ' + CAT[s.cat] + '"></i><b>' + s.icao + "</b><em style=\"color:" + CAT[s.cat] + "\">" + s.cat + "</em></div>";
            var m = L.marker([s.lat, s.lon], {
              icon: L.divIcon({ className: "", html: html, iconSize: [96, 22], iconAnchor: [7, 11] }),
              keyboard: true, title: s.name
            });
            m.on("click", function () { openMetar(s); });
            m.addTo(map); mMetar.push(m);
          });
          SYNOP.forEach(function (s) {
            var r = 6;
            var m = L.circleMarker([s.lat, s.lon], {
              radius: r, className: "", color: "#0d1117", weight: 2,
              fillColor: synopColor(s), fillOpacity: 0.9
            });
            m.on("click", function () { openSynop(s); });
            m.bindTooltip(s.name + " · " + s.wspd + " м/с", { direction: "top", opacity: 0.9 });
            m.addTo(map); mSynop.push(m);
          });
        }
        // те же пороги, что у METAR: НГО 150/300/900 м, видимость 1,6/5/8 км
        function synopColor(s) {
          if (s.vis < 1.6 || s.cloud < 150) return CAT.LIFR;
          if (s.vis < 5 || s.cloud < 300) return CAT.IFR;
          if (s.vis <= 8 || s.cloud <= 900) return CAT.MVFR;
          return CAT.VFR;
        }
        function applyLayers() {
          if (!map || !ok) return;
          mMetar.forEach(function (m) { state.metar ? m.addTo(map) : map.removeLayer(m); });
          mSynop.forEach(function (m) { state.synop ? m.addTo(map) : map.removeLayer(m); });
        }
        makeMarkers();

        /* ---------- ветровые частицы ---------- */
        var cv = document.getElementById("wind"), ctx = cv.getContext("2d");
        var parts = [], DPR = Math.min(2, window.devicePixelRatio || 1);
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        function sizeCanvas() {
          cv.width = window.innerWidth * DPR; cv.height = window.innerHeight * DPR;
          cv.style.width = window.innerWidth + "px"; cv.style.height = window.innerHeight + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          seed();
        }
        function seed() {
          parts = [];
          var n = Math.round((window.innerWidth * window.innerHeight) / 7000);
          for (var i = 0; i < n; i++) parts.push(newPart());
        }
        function newPart() {
          return { x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, a: Math.random() * 90 + 30 };
        }
        // поле ветра собираем из станций: обратные расстояния
        function field(x, y) {
          var ux = 0, uy = 0, w = 0;
          var pts = SYNOP.concat(METAR.map(function (m) { return { lat: m.lat, lon: m.lon, wspd: m.wspd, wdir: m.wdir }; }));
          for (var i = 0; i < pts.length; i++) {
            var p = pts[i], s = project(p.lat, p.lon);
            var dx = x - s.x, dy = y - s.y, d2 = dx * dx + dy * dy + 9000;
            var dir = (p.wdir != null ? p.wdir : 320) * Math.PI / 180;
            // метео-направление «откуда» -> вектор «куда»
            var vx = Math.sin(dir) * p.wspd, vy = -Math.cos(dir) * p.wspd;
            var k = 1 / d2;
            ux += -vx * k; uy += -vy * k; w += k;
          }
          if (!w) return { x: 0, y: 0 };
          return { x: ux / w, y: uy / w };
        }
        function tick() {
          if (!state.wind) { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
          ctx.globalCompositeOperation = "destination-out";
          ctx.fillStyle = "rgba(13,17,23,0.10)";
          ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
          ctx.globalCompositeOperation = "source-over";
          ctx.lineWidth = 1.1;
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i], f = field(p.x, p.y);
            var nx = p.x + f.x * 0.3, ny = p.y + f.y * 0.3;
            var sp = Math.min(1, Math.hypot(f.x, f.y) / 18);
            ctx.strokeStyle = "rgba(" + Math.round(140 + 110 * sp) + "," + Math.round(200 - 40 * sp) + ",255," + (0.25 + 0.45 * sp) + ")";
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
            p.x = nx; p.y = ny; p.a -= 1;
            if (p.a < 0 || p.x < -10 || p.x > window.innerWidth + 10 || p.y < -10 || p.y > window.innerHeight + 10) parts[i] = newPart();
          }
        }
        var timer = null;
        function run() { if (timer) clearInterval(timer); if (!reduce) timer = setInterval(tick, 48); else tick(); }
        sizeCanvas(); run();
        window.addEventListener("resize", function () { sizeCanvas(); if (failed && !(map && ok)) drawFallback(); });
        if (map && ok) { map.on("move zoom", function () { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }); }

        /* ---------- оценка по минимуму ---------- */
        function metarBelow(s) { return s.vis < MIN_VIS || s.ceil < MIN_CEIL; }
        function synopBelow(s) { return s.vis * 1000 < MIN_VIS || s.cloud < 80; }
        function score(o) {
          // чем хуже, тем больше: видимость (м) и НГО (м), затем порывы
          var isM = o.ceil != null;
          var vis = isM ? o.vis : o.vis * 1000;
          var ceil = isM ? o.ceil / 3.28084 : o.cloud;
          return 20000 - Math.min(vis, 10000) - Math.min(ceil, 1000) * 10 + (o.wgst || o.wspd) * 5;
        }

        /* ---------- панель ---------- */
        function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

        function renderList() {
          var items = [];
          METAR.forEach(function (s) {
            items.push({ kind: "metar", o: s, color: CAT[s.cat], title: s.icao + " · " + s.name,
              sub: s.cat + " · ОВИ " + s.vis + " м · НГО " + s.ceil + " фт",
              val: s.wspd + (s.wgst ? "G" + s.wgst : "") + " м/с", bad: metarBelow(s), sc: score(s) });
          });
          SYNOP.forEach(function (s) {
            items.push({ kind: "synop", o: s, color: synopColor(s), title: s.name + " · SYNOP",
              sub: s.phen + " · вид. " + s.vis + " км",
              val: s.wspd + (s.wgst ? "G" + s.wgst : "") + " м/с", bad: synopBelow(s), sc: score(s) });
          });
          items.sort(function (a, b) { return b.sc - a.sc; });
          var bad = items.filter(function (i) { return i.bad; }).length;
          var html =
            '<h2>Станции: худшие сверху</h2>' +
            '<p class="x-sub">' + items.length + " пунктов · ниже минимума 80 м × 800 м: " + bad + "</p>" +
            '<ul class="x-rows">';
          items.forEach(function (i, n) {
            var mark = state.min && i.bad ? ' <span class="x-flag" style="background:#ff4d00;color:#0d1117">ниже минимума</span>' : "";
            html +=
              '<li><button class="x-row" type="button" data-kind="' + i.kind + '" data-id="' + (i.o.icao || i.o.id) + '">' +
              '<i class="x-bullet" style="background:' + i.color + '"></i>' +
              "<span><b>" + esc(i.title) + mark + "</b><small>" + esc(i.sub) + "</small></span>" +
              '<span class="x-val">' + esc(i.val) + "</span></button></li>";
          });
          html += "</ul>";
          panel.innerHTML = html;
          wire();
        }

        function openMetar(s) {
          state.sel = s.icao;
          var below = metarBelow(s);
          panel.innerHTML =
            '<button class="x-close" id="pclose" type="button" aria-label="Закрыть">✕</button>' +
            "<h2>" + s.icao + "</h2>" +
            '<p class="x-sub">' + esc(s.name) + " · " + esc(s.place) + " · METAR " + s.time + "</p>" +
            '<p style="margin-top:10px"><span class="x-flag" style="background:' + CAT[s.cat] + '">' + s.cat + "</span></p>" +
            "<h3>Погода</h3><dl class=\"x-kv\">" +
            "<dt>Ветер</dt><dd>" + s.wdir + "° " + s.wspd + (s.wgst ? " пор. " + s.wgst : "") + " м/с</dd>" +
            "<dt>Видимость</dt><dd>" + s.vis + " м</dd>" +
            "<dt>НГО</dt><dd>" + s.ceil + " фт (" + Math.round(s.ceil / 3.28084) + " м)</dd>" +
            "<dt>T / Td</dt><dd>" + s.temp + " / " + s.dew + " °C</dd>" +
            "<dt>QNH</dt><dd>" + s.qnh + " гПа</dd></dl>" +
            '<div class="x-note ' + (below ? "x-note--bad" : "x-note--ok") + '">' +
            (below ? "Ниже моего минимума 80 м × 800 м." : "Выше моего минимума 80 м × 800 м.") + "</div>" +
            '<div class="x-raw">' + esc(s.raw) + "</div>";
          wire();
          if (map && ok) map.panTo([s.lat, s.lon], { animate: true });
        }

        function openSynop(s) {
          state.sel = s.id;
          var below = synopBelow(s);
          panel.innerHTML =
            '<button class="x-close" id="pclose" type="button" aria-label="Закрыть">✕</button>' +
            "<h2>" + esc(s.name) + "</h2>" +
            '<p class="x-sub">SYNOP · ' + s.lat.toFixed(2) + "° с.ш., " + s.lon.toFixed(2) + "° в.д.</p>" +
            "<h3>Наблюдение</h3><dl class=\"x-kv\">" +
            "<dt>Явление</dt><dd>" + esc(s.phen) + "</dd>" +

              var m = L.marker([s.lat, s.lon], { icon: L.divIcon({ className: "x-arrow", html: arrowSvg(s.wdir, s.wspd || 0, s.wgst), iconSize: [64, 64], iconAnchor: [32, 32] }), interactive: false, keyboard: false, zIndexOffset: -500 });
              m.addTo(map); arrows.push(m);
            });
          }
          arrowsUpdate();
          document.getElementById("t-wind").addEventListener("click", function () { arrowsUpdate(); if (state.wind) reset(); });

          /* ---- пипетка: значение под курсором ---- */
          if (map && ok && window.matchMedia("(hover: hover)").matches) {
            var tip = document.createElement("div"); tip.className = "x-probe"; tip.style.display = "none"; document.body.appendChild(tip);
            var DIRS = ["С", "ССВ", "СВ", "ВСВ", "В", "ВЮВ", "ЮВ", "ЮЮВ", "Ю", "ЮЮЗ", "ЮЗ", "ЗЮЗ", "З", "ЗСЗ", "СЗ", "ССЗ"];
            map.on("mousemove", function (e) {
              if (!G) { tip.style.display = "none"; return; }
              var w = windAt(e.latlng.lat, e.latlng.lng), f = FIELDS[gField], h = "";
              if (w) h += '<b>' + String(Math.round(w.dir / 10) * 10).padStart(3, "0") + "° " + DIRS[Math.round(w.dir / 22.5) % 16] + " · " + w.s.toFixed(0) + " м/с</b>" + (gField === "ws925" ? " 925 гПа" : " 10 м");
              if (gField !== "none" && gField.indexOf("ws") !== 0) {
                var v = sample(gField, gIdx, e.latlng.lat, e.latlng.lng);
                h += "<br>" + f.name + ": " + (v == null ? "—" : gField === "ice" ? (v >= 1 ? "высокий" : v > 0 ? "умеренный" : "нет") : (v >= 100 ? Math.round(v / 10) * 10 : v.toFixed(1)) + " " + f.unit);
              }
              if (!h) { tip.style.display = "none"; return; }
              tip.innerHTML = h; tip.style.display = "block";
              tip.style.left = (e.originalEvent.clientX + 14) + "px"; tip.style.top = (e.originalEvent.clientY + 14) + "px";
            });
            map.on("mouseout movestart", function () { tip.style.display = "none"; });
          }

          /* ---- кнопка «▶» для прокрутки срока прогноза ---- */
          var waitTl = setInterval(function () {
            var hr = document.getElementById("t-hour"); if (!hr) return; clearInterval(waitTl);
            var b = document.createElement("button"); b.type = "button"; b.className = "x-play"; b.setAttribute("aria-label", "Проиграть прогноз"); b.textContent = "▶";
            hr.parentNode.insertBefore(b, hr);
            var pt = null;
            b.addEventListener("click", function () {
              if (pt) { clearInterval(pt); pt = null; b.textContent = "▶"; return; }
              b.textContent = "❚❚";
              pt = setInterval(function () { hr.value = (+hr.value + 1) % (+hr.max + 1); hr.dispatchEvent(new Event("input")); }, 1300);
            });
          }, 300);
          setTimeout(function () { clearInterval(waitTl); }, 20000);

          /* ---- легенда частиц ---- */
          var lg = document.querySelector(".x-legend");
          if (lg) lg.insertAdjacentHTML("beforeend", '<span class="x-wl">Ветер <i style="background:linear-gradient(90deg,' + PAL.map(function (q) { return "rgb(" + q[1].join(",") + ")"; }).join(",") + ')"></i>0 · 10 · 20+ м/с</span>');
        })();

        /* ================= ДИЗАЙН v2: рельса слоёв, таймлайн, карточка с метеограммой ================= */
        (function v2() {
          var ICO = {
            base: '<path d="M4 15h16M6 11a4 4 0 0 1 7.5-2A3.5 3.5 0 1 1 17 15" /><path d="M4 19h16" stroke-dasharray="2 2"/>',
            low: '<path d="M7 17a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A3.5 3.5 0 1 1 17 17Z"/>',
            vis: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',
            precip: '<path d="M7 14a4 4 0 0 1 .5-8 5 5 0 0 1 9.4 1.5A3 3 0 1 1 17 14"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>',
            ws10: '<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/>',
            ws925: '<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3"/><path d="M19 3v6M17 5l2-2 2 2"/>',
            ice: '<path d="M12 2v20M4 7l16 10M20 7L4 17"/><path d="M9 4l3 2 3-2M9 20l3-2 3 2"/>',
            none: '<circle cx="12" cy="12" r="8"/><path d="M6 18L18 6"/>'
          };
          var SHORT = { base: "НГО", low: "Облака", vis: "Видим.", precip: "Осадки", ws10: "10 м", ws925: "800 м", ice: "Обледен.", none: "Без поля" };
          function svg(k) { return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICO[k] + "</svg>"; }
          var rail = document.createElement("nav"); rail.className = "x-rail x-glass"; rail.setAttribute("aria-label", "Слои");
          rail.innerHTML = '<div class="x-rail-h">Поле</div><div id="r-fields" class="x-rail-g"></div><div class="x-rail-h">Слои</div><div id="r-layers" class="x-rail-g x-rail-g--l"></div>';
          document.querySelector(".x-app").appendChild(rail);
          // слои-переключатели переезжают в рельсу
          function moveLayers() {
            ["t-wind", "t-metar", "t-synop", "t-areas"].forEach(function (id) {
              var b = document.getElementById(id); if (b && b.parentNode.id !== "r-layers") { b.classList.add("x-rl"); document.getElementById("r-layers").appendChild(b); }
            });
          }
          moveLayers();
          var tries = 0, wt = setInterval(function () {
            moveLayers();
            var sel = document.getElementById("t-field");
            if (sel && !document.getElementById("r-fields").children.length) {
              sel.style.display = "none";
              Object.keys(FIELDS).forEach(function (k) {
                var b = document.createElement("button"); b.type = "button"; b.className = "x-rf"; b.dataset.k = k;
                b.innerHTML = svg(k) + "<span>" + SHORT[k] + "</span>"; b.title = FIELDS[k].name;
                b.setAttribute("aria-pressed", k === gField ? "true" : "false");
                b.addEventListener("click", function () {
                  sel.value = k; sel.dispatchEvent(new Event("change"));
                  Array.prototype.forEach.call(document.querySelectorAll(".x-rf"), function (q) { q.setAttribute("aria-pressed", q.dataset.k === k ? "true" : "false"); });
                });
                document.getElementById("r-fields").appendChild(b);
              });
              buildTicks();
            }
            if ((document.getElementById("r-fields").children.length && document.getElementById("t-areas")) || ++tries > 60) clearInterval(wt);
          }, 300);

          // шкала времени: метки часов под ползунком
          function buildTicks() {
            var hr = document.getElementById("t-hour"); if (!hr || !G) return;
            var box = document.createElement("div"); box.className = "x-ticks";
            var n = G.times.length, p = function (x) { return (x < 10 ? "0" : "") + x; }, nowI = 0, best = 1e15;
            G.times.forEach(function (t, i) { var dd = Math.abs(new Date(t.replace("Z", ":00Z")) - Date.now()); if (dd < best) { best = dd; nowI = i; } });
            G.times.forEach(function (t, i) {
              var d = new Date(t.replace("Z", ":00Z")), sp = document.createElement("span");
              sp.style.left = (i / (n - 1) * 100) + "%";
              sp.textContent = i === nowI ? "сейчас" : p(d.getUTCHours()) + "Z";
              if (i === nowI) sp.className = "x-tick-now";
              if (d.getUTCHours() === 0) sp.className = "x-tick-day";
              box.appendChild(sp);
            });
            var wrap = document.createElement("div"); wrap.className = "x-trk";
            hr.parentNode.insertBefore(wrap, hr); wrap.appendChild(hr); wrap.appendChild(box);
            if (nowI) { hr.value = nowI; hr.dispatchEvent(new Event("input")); }
          }

          // крупные цифры в карточке станции + метеограмма модели на 12 ч
          function hero(vis, ceilM, wdir, wspd, wgst) {
            function cell(lbl, val, unit, bad) { return '<div class="x-hc' + (bad ? " x-hc--bad" : "") + '"><span>' + lbl + "</span><b>" + val + "<small>" + unit + "</small></b></div>"; }
            return '<div class="x-hero">' +
              cell("Видимость", vis >= 10000 ? "10+" : vis >= 1000 ? (vis / 1000).toFixed(vis < 5000 ? 1 : 0) : Math.round(vis), vis >= 1000 ? "км" : "м", vis < MIN_VIS) +
              cell("НГО", ceilM >= 3000 ? "нет" : Math.round(ceilM), ceilM >= 3000 ? "" : "м", ceilM < 80) +
              cell("Ветер", (wdir == null ? "—" : String(wdir).padStart(3, "0") + "°") + " " + wspd + (wgst ? "G" + wgst : ""), "м/с", false) + "</div>";
          }
          function chart(lat, lon) {
            if (!G) return "";
            var n = G.times.length, Wd = 300, Hc = 54, vis = [], base = [];
            for (var h = 0; h < n; h++) { vis.push(sample("vis", h, lat, lon)); base.push(sample("base", h, lat, lon)); }
            function one(arr, max, thr, lbl, unit, fmt) {
              var pts = arr.map(function (v, i) { var y = v == null ? max : Math.min(v, max); return [i / (n - 1) * Wd, Hc - y / max * (Hc - 4)]; });
              var line = pts.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");
              var ty = Hc - thr / max * (Hc - 4), lo = arr.reduce(function (m, v) { return v != null && v < m ? v : m; }, Infinity);
              var cur = gIdx / (n - 1) * Wd;
              return '<div class="x-mg"><div class="x-mg-h"><span>' + lbl + '</span><span>мин. ' + (lo === Infinity ? "—" : fmt(lo)) + " " + unit + "</span></div>" +
                '<svg viewBox="0 0 ' + Wd + " " + Hc + '" preserveAspectRatio="none" width="100%" height="' + Hc + '">' +
                '<defs><linearGradient id="g' + lbl.length + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa3ff" stop-opacity=".35"/><stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/></linearGradient></defs>' +
                '<rect x="0" y="' + ty.toFixed(1) + '" width="' + Wd + '" height="' + (Hc - ty).toFixed(1) + '" fill="rgba(255,77,0,.12)"/>' +
                '<line x1="0" x2="' + Wd + '" y1="' + ty.toFixed(1) + '" y2="' + ty.toFixed(1) + '" stroke="#ff8a00" stroke-dasharray="4 3" stroke-width="1"/>' +
                '<path d="' + line + " L" + Wd + " " + Hc + " L0 " + Hc + ' Z" fill="url(#g' + lbl.length + ')"/>' +
                '<path d="' + line + '" fill="none" stroke="#9ecbff" stroke-width="1.8" vector-effect="non-scaling-stroke"/>' +
                '<line x1="' + cur + '" x2="' + cur + '" y1="0" y2="' + Hc + '" stroke="#fff" stroke-opacity=".5" stroke-width="1"/></svg></div>';
            }
            var p = function (x) { return (x < 10 ? "0" : "") + x; }, t0 = new Date(G.times[0].replace("Z", ":00Z")), t1 = new Date(G.times[n - 1].replace("Z", ":00Z"));
            return "<h3>Модель на " + (n - 1) + " ч</h3>" +
              one(vis, 10, MIN_VIS / 1000, "Видимость", "км", function (v) { return v.toFixed(1); }) +
              one(base, 600, 80, "НГО (оценка)", "м", function (v) { return Math.round(v / 10) * 10; }) +
              '<div class="x-mg-x"><span>' + p(t0.getUTCHours()) + "Z</span><span>оранжевым — ниже минимума 80 × 800</span><span>" + p(t1.getUTCHours()) + "Z</span></div>";
          }
          var _m = openMetar, _s = openSynop;
          openMetar = function (st) {
            _m(st);
            var sub = panel.querySelector(".x-sub"); if (sub) sub.insertAdjacentHTML("afterend", hero(st.vis, st.ceil >= 99999 ? 99999 : st.ceil / 3.28084, st.wdir, st.wspd, st.wgst));
            panel.insertAdjacentHTML("beforeend", chart(st.lat, st.lon));
          };
          openSynop = function (st) {
            _s(st);
            var sub = panel.querySelector(".x-sub"); if (sub) sub.insertAdjacentHTML("afterend", hero(st.vis * 1000, st.cloud, st.wdir, st.wspd, st.wgst));
            panel.insertAdjacentHTML("beforeend", chart(st.lat, st.lon));
          };
        })();

        if (!ok) fail("Карта не загрузилась — показана схема берега");
        renderList();
      })();
    </script>
  </body>
</html>
